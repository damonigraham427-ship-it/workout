<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workout Checklist</title>
<link rel="stylesheet" href="exam.css">
<style>
  .ck-sec { color: var(--muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.06em; margin: 1.4rem 0 0.4rem; }
  .ck-row { display: flex; align-items: center; gap: 0.6rem; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 0.7rem 0.9rem; margin: 0.5rem 0; transition: opacity 0.4s, transform 0.4s; }
  .ck-main { flex: 1; display: flex; flex-direction: column; gap: 0.15rem; }
  .ck-label { font-weight: 600; }
  .ck-last { font-size: 0.8rem; color: var(--muted); }
  .ck-row input[type="date"], .ck-row input[type="text"] { font: inherit; padding: 0.45rem 0.5rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); }
  .ck-row input[type="text"] { flex: 1; }
  .ck-btn { font: inherit; font-weight: 700; border: none; border-radius: 8px; padding: 0.5rem 0.9rem; background: #16a34a; color: #fff; cursor: pointer; }
  .ck-row.ck-done { border-color: #16a34a; }
  .ck-row.ck-done .ck-label { text-decoration: line-through; color: var(--muted); }
  .ck-row.ck-done .ck-btn { background: var(--muted); }
  .ck-row.ck-out { opacity: 0; transform: translateX(24px); }
  .ck-row.ck-in { animation: ckin 0.45s ease; }
  @keyframes ckin { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .ck-sets-wrap { display: flex; align-items: center; gap: 0.35rem; }
  .ck-sets-label { font-size: 0.75rem; color: var(--muted); }
  .ck-sets { font: inherit; padding: 0.45rem 0.4rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); }
  .ck-caught { color: var(--muted); margin: 0.5rem 0; }
</style>
</head>
<body>
<main class="wrap">
  <p><a href="workout.html">&lsaquo; Workout Elements</a></p>
  <h1>Workout Checklist</h1>
  <p class="sub">The next step for every category, in one place. Enter the date you finished it and the next one pops up.</p>
  <div id="ck-host"><p class="sub">Loading&hellip;</p></div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="sync.js"></script>
<script src="checklist.js"></script>
</body>
</html>
